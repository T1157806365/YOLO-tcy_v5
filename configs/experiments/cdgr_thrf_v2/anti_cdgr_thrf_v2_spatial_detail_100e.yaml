traincc: |
  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  mkdir -p logs pid
  nohup python -u train_gmls_roi_hybrid.py \
    --cfg configs/experiments/cdgr_thrf_v2/anti_cdgr_thrf_v2_spatial_detail_100e.yaml \
    > logs/AntiUAV_CDGR_THRF_V2_100e.log 2>&1 &
  echo $! > pid/AntiUAV_CDGR_THRF_V2_100e.pid
  tail -f logs/AntiUAV_CDGR_THRF_V2_100e.log

  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  python val_cdgr_thrf_v2.py \
    --cfg configs/experiments/cdgr_thrf_v2/anti_cdgr_thrf_v2_spatial_detail_100e.yaml \
    --weights runs/cdgr_thrf_v2/yolo26m_AntiUAV_CDGR_THRF_V2_100e_seed0/weights/best.pt \
    --split test \
    --device 3 \
    --batch 4 \
    --workers 4 \
    --warmup 3 \
    --plots

  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  python visualize_gmls_v2_roi_hybrid_full.py \
    --cfg configs/experiments/cdgr_thrf_v2/anti_cdgr_thrf_v2_spatial_detail_100e.yaml \
    --weights runs/cdgr_thrf_v2/yolo26m_AntiUAV_CDGR_THRF_V2_100e_seed0/weights/best.pt \
    --split test \
    --device 6 \
    --indices 0 50 100 150 200 250 300 350 400 450 500 550 600 \
    --conf 0.25 \
    --iou 0.70 \
    --canvas 1200
model:
  variant: rlsfa_gtga_centered_bhlr_v2
  name: yolo26m
  nc: 1
  pretrained: true
  fusion: add
  align_mode: bilinear
  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered
    reference_scale: 3
    apply_scales:
    - 3
    - 4
    - 5
    hidden_channels: 32
    coarse_radius: 20
    coarse_temperature: 0.1
    use_targetness_for_correlation: true
    coarse_local_soft_enabled: false
    coarse_local_radius: 6
    coarse_local_temperature: 0.1
    coarse_gmls_enabled: true
    coarse_gmls_topk: 3
    coarse_gmls_nms_radius: 4
    coarse_gmls_aggregation_temperature: 0.12
    coarse_gmls_global_prior: 0.6
    coarse_gmls_feature_weight: 0.65
    coarse_gmls_target_weight: 0.35
    gmls_v2_correction_enabled: true
    gmls_v2_quality_hidden: 32
    gmls_v2_route_logit_margin: 0.2
    fine_translation_enabled: true
    fine_translation_radius: 2
    fine_translation_temperature: 0.05
    anchor_power: 4.0
    moment_power: 2.0
    local_window_sigma: 0.1
    moment_border_margin: 2
    sigma_min: 0.005
    scale_min: 0.5
    scale_max: 3.0
    padding_mode: border
    align_corners: true
    reliability_gate:
      enabled: false
  bhlr:
    enabled: false
    scales: []
    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24
    guidance_mode: alignment
    detach_alignment_guidance: true
  roi_single_head:
    enabled: true
    local_pretrained: true
    roi_size: 640
    guide_hidden: 32
    temperature: 0.12
    anchor_mix: 0.3
    center_grad_scale: 0.1
    geometry_grad_scale: 0.1
    min_gt_visible: 0.6
    topk: 2
    p3_channels: 512
    min_roi_separation: 0.1
    aux_bn_eval: true
    top2_diverse_enabled: true
  dual_head:
    enabled: true
    scope: global_neck_and_detect_only
  geo_box:
    enabled: true
  geometry_refinement:
    enabled: true
    type: center_decoupled_local_crossmodal_residual
    projection_channels: 32
    hidden_channels: 64
    patch_size: 11
    patch_radius: 0.12
    max_center_shift_semantic_px: 24.0
    max_log_scale: 0.5
  thrf_v2:
    enabled: true
    p2_channels: 256
    p3_channels: 512
    key_dim: 16
    value_dim: 24
    radius: 1
    temperature: 4.0
    geo_sigma: 1.0
    groups: 8
    detail_init: 0.05
    lambda_tir_heat: 0.05
    min_tir_valid: 0.7
data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/Anti-UAV-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/Anti-UAV-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative
train:
  device: 1,2
  batch: 8
  batch_mode: global
  accumulate: 2
  val_batch: 4
  val_workers: 4
  val_interval: 1
  workers: 4
  epochs: 100
  optimizer: SGD
  lr0: 0.005
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  patience: 100
  early_stop_min_delta: 1.0e-06
  resume: null
  stage2:
    enabled: false
    epochs: 0
    lr0: 0.001
    lrf: 0.01
    patience: 50
    early_stop_min_delta: 1.0e-06
  gt_assist_start: 0.8
  gt_assist_epochs: 20
  gt_jitter_high_px: 48.0
  progress_interval: 15
  gt_second_prob_start: 0.8
  gt_second_epochs: 35
augment:
  fliplr: 0.5
  flipud: 0.0
  rgb_photo_p: 0.85
  rgb_brightness: 0.12
  rgb_contrast: 0.18
  rgb_gamma: 0.15
  rgb_blur_p: 0.1
  rgb_noise_p: 0.1
  rgb_noise_std: 0.008
  tir_photo_p: 0.75
  tir_contrast: 0.18
  tir_gamma: 0.16
  tir_blur_p: 0.08
  tir_noise_p: 0.15
  tir_noise_std: 0.012
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
  alignment:
    enabled: true
    lambda_alignment: 0.2
    lambda_anchor: 1.0
    lambda_coarse: 1.0
    lambda_scale: 1.0
    lambda_targetness: 0.2
    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0
    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0
    clamp_gt_translation: true
    lambda_v2_quality: 0.25
    lambda_v2_route: 0.1
    v2_quality_iou_weight: 0.8
    v2_quality_advantage: 0.05
    v2_route_target_temperature: 0.05
    lambda_final_center: 0.25
    final_center_norm_px: 8.0
    final_center_beta: 0.5
    final_center_warmup_epochs: 10
    lambda_final_size: 0.05
    lambda_final_giou: 0.1
    final_size_beta: 0.2
    final_box_warmup_epochs: 10
  roi:
    lambda_local: 1.0
    lambda_guide: 0.2
    lambda_center: 2.0
    sigma_px: 2.5
    lambda_global_aux: 0.5
eval:
  conf: 0.001
  iou: 0.7
  preview_num: 8
  crop_nms_iou: 0.5
  max_det: 300
output:
  project: runs/cdgr_thrf_v2
  name: yolo26m_AntiUAV_CDGR_THRF_V2_100e_seed0
