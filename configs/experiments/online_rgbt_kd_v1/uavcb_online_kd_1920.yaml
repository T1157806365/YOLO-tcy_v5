traincc:
  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  mkdir -p logs pid
  nohup python -u -m online_rgbt_kd_v1.train \
    --cfg configs/experiments/online_rgbt_kd_v1/uavcb_online_kd_1920.yaml \
    > logs/online_rgbt_kd_v1_1920.log 2>&1 &
  echo $! > pid/online_rgbt_kd_v1_1920.pid
  tail -n 5 -f logs/online_rgbt_kd_v1_1920.log

  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  python -m online_rgbt_kd_v1.val \
    --weights /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/runs/online_rgbt_kd_v1/yolo26m_UAVCB_RGB1920_sem640_TIR640_DMLS_BHLR_onlineKD_seed0/weights/best.pt \
    --split test \
    --device 0 \
    --batch 2 \
    --workers 4 \
    --conf 0.001 \
    --iou 0.70
  
  conda activate tcy
  cd /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5
  python eval_alignment_iou_displacement_GMLS_v2.py \
    --weights /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/runs/online_rgbt_kd_v1/yolo26m_UAVCB_RGB1920_sem640_TIR640_DMLS_BHLR_onlineKD_seed0/weights/best.pt \
    --device 0 \
    --batch 4 \
    --workers 4 \
    --split test \
    --save-dir runs/alignment_iou_UAV-CB_onlineKD
model:
  variant: online_rgbt_kd_v1
  name: yolo26m
  nc: 1
  # true: official YOLO26m pretrained (LOCAL configs/weights; NO automatic download)
  # false: RGB/TIR backbone and head random initialization
  pretrained: true
  fusion: add                   # compatibility with parent's construction; replaced by P3 reliability residual
  fusion_indices: [4, 6, 10]   # YOLO26m P3/P4/P5
  align_mode: bilinear
  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered
    reference_scale: 3
    apply_scales: [3, 4, 5]
    hidden_channels: 32
    coarse_radius: 20
    coarse_temperature: 0.10
    coarse_local_soft_enabled: true
    coarse_local_radius: 6
    coarse_local_temperature: 0.10
    coarse_gmls_enabled: false
    gmls_v2_correction_enabled: false
    fine_translation_enabled: true
    fine_translation_radius: 2
    fine_translation_temperature: 0.05
    use_targetness_for_correlation: true
    anchor_power: 4.0
    moment_power: 2.0
    local_window_sigma: 0.10
    moment_border_margin: 2
    sigma_min: 0.005
    scale_min: 0.50
    scale_max: 3.00
    padding_mode: border
    align_corners: true
    reliability_gate:
      enabled: false            # disable historical gate; new reliability_net handles this
  bhlr:
    enabled: true
    scales: [3]
    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24
    guidance_mode: alignment
    detach_alignment_guidance: true

data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/UAV-CB-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/UAV-CB-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative

train:
  device: '5,6'
  # 1920 RGB is memory-intensive. Global 32 means 16 images/GPU; reduce to 8 or 4 if CUDA OOM.
  batch: 32
  batch_mode: global
  val_batch: 2
  workers: 4
  epochs: 300
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  patience: 50
  early_stop_min_delta: 0.000001
  resume: null
  ddp_find_unused_parameters: true  # safe for conditional aux/geometry gradients
  stage2:
    enabled: true
    epochs: 200
    lr0: 0.001
    lrf: 0.01
    patience: 50
    early_stop_min_delta: 0.000001

augment:
  fliplr: 0.5
  flipud: 0.0

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
  alignment:
    enabled: true
    lambda_alignment: 0.20
    lambda_anchor: 1.0
    lambda_coarse: 1.0
    lambda_scale: 1.0
    lambda_targetness: 0.20
    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0
    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0
    clamp_gt_translation: true

# A response-map-based ONLINE distillation, not YOLO head logits KD.
# Changing any lambda to 0 produces an ablation without changing training code.
online_kd:
  enabled: true
  aux_box_weight: 0.50      # auxiliary GT-center bbox regression (GIoU+L1)
  target_threshold: 0.08
  tir_threshold: 0.20
  lambda_aux_rgb: 0.10
  lambda_aux_tir: 0.10
  lambda_aux_fused: 0.10
  lambda_rgb_keep: 0.05
  lambda_tir_kd: 0.02
  lambda_reliability: 0.10
  lambda_final_center: 0.02
  lambda_final_giou: 0.10

output:
  project: runs/online_rgbt_kd_v1
  name: yolo26m_UAVCB_RGB1920_sem640_TIR640_DMLS_BHLR_onlineKD_seed0
