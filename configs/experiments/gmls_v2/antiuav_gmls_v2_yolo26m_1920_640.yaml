model:
  variant: rlsfa_gtga_centered_bhlr_v2
  name: yolo26m
  nc: 1
  pretrained: ture
  fusion: add
  align_mode: bilinear

  # ----------------------------------------------------------
  # RLSFA coarse translation + fine residual translation
  # + Local-GTGA centered scale
  # ----------------------------------------------------------
  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered

    reference_scale: 3
    apply_scales: [3, 4, 5]
    hidden_channels: 32

    # Existing coarse translation
    coarse_radius: 20
    coarse_temperature: 0.10
    use_targetness_for_correlation: true

    # ========================================================
    # DMLS-Align v1: ONLY change in the alignment estimator.
    #
    # Full 41x41 correlation is still computed.
    # argmax selects only the dominant basin center.
    # Final coarse offset = LOCAL soft expectation in 7x7 basin.
    # ========================================================
    coarse_local_soft_enabled: false

    # 3 -> 7x7 basin around the dominant mode.
    # First clean experiment: keep exactly 3.
    coarse_local_radius: 6

    # Use the same temperature as the historical coarse softmax.
    coarse_local_temperature: 0.10
    #原为0.10
    # ========================================================
    # GMLS v2 (GMLS primary + DMLS bbox-supervised correction)
    # Candidate 0 : historical GLOBAL soft offset
    # Candidate 1-3: three distinct LOCAL-soft modes
    # Final coarse offset: target-aware SOFT aggregation.
    # ========================================================
    coarse_gmls_enabled: true

    # Three distinct correlation modes.
    coarse_gmls_topk: 3

    # Suppress adjacent maxima so one physical mode is not repeated.
    coarse_gmls_nms_radius: 4

    # Candidate-level soft aggregation temperature.
    coarse_gmls_aggregation_temperature: 0.12

    # Stability prior: 60% prior mass to historical Global Soft,
    # 40% shared by local modes according to their correlation mass.
    coarse_gmls_global_prior: 0.60

    # Candidate evidence = 0.65 * localized feature consistency
    #                    + 0.35 * targetness soft-IoU.
    coarse_gmls_feature_weight: 0.65
    coarse_gmls_target_weight: 0.35

    # The ONLY change to the original GMLS estimator:
    # predict two candidate qualities and conditionally use the DMLS readout.
    # The default output is original GMLS, with NO coordinate averaging added.
    gmls_v2_correction_enabled: true
    gmls_v2_quality_hidden: 32
    gmls_v2_route_logit_margin: 0.20

    # NEW: small local residual translation search
    fine_translation_enabled: true
    fine_translation_radius: 2
    fine_translation_temperature: 0.05

    # Existing Local-GTGA scale
    anchor_power: 4.0
    moment_power: 2.0
    local_window_sigma: 0.10

    moment_border_margin: 2
    sigma_min: 0.005
    scale_min: 0.50
    scale_max: 3.00

    padding_mode: border
    align_corners: true

    reliability_gate:
      enabled: false

  # ----------------------------------------------------------
  # BHLR-v2: unchanged
  # ----------------------------------------------------------
  bhlr:
    enabled: true
    scales: [3]
    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24
    guidance_mode: alignment
    detach_alignment_guidance: true

# ============================================================
# Dataset
# ============================================================
data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v4/configs/datasets/Anti-UAV-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v4/configs/datasets/Anti-UAV-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative

# ============================================================
# Training
# ============================================================
train:
  device: "4"
  batch: 16
  batch_mode: global
  workers: 4
  epochs: 300
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  patience: 50
  early_stop_min_delta: 0.000001
  resume: null

  stage2:
    enabled: true
    epochs: 200
    lr0: 0.001
    lrf: 0.01
    patience: 50
    early_stop_min_delta: 0.000001

augment:
  fliplr: 0.5
  flipud: 0.0

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

  alignment:
    enabled: true
    lambda_alignment: 0.20
    lambda_anchor: 1.00
    lambda_coarse: 1.00
    lambda_scale: 1.00
    lambda_targetness: 0.20
    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0
    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0
    clamp_gt_translation: true

    # AMP-safe bbox-supervised quality and selection objectives.
    lambda_v2_quality: 0.25
    lambda_v2_route: 0.10
    v2_quality_iou_weight: 0.80
    v2_quality_advantage: 0.05
    v2_route_target_temperature: 0.05

output:
  project: runs/rlsfa_gtga_bhlr_gmls_v2
  name: yolo26m_AntiUAV_GMLSv2_DMLS_BHLRv2-P3_ADD_rgb1920_seed0_bs16
