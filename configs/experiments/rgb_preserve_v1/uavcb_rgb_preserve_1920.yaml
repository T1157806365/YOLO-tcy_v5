# Step 2: 1920 RGB high branch, preserve RGB-only 640 semantic detector at init
model:
  variant: rgb_preserve_v1
  name: yolo26m
  nc: 1
  pretrained: false
  fusion: add
  align_mode: bilinear
  rlsfa_gtga_centered:
    enabled: true
    type: rlsfa_gtga_centered
    reference_scale: 3
    apply_scales: [3, 4, 5]
    hidden_channels: 32
    coarse_radius: 20
    coarse_temperature: 0.10
    use_targetness_for_correlation: true
    coarse_local_soft_enabled: true
    coarse_local_radius: 6
    coarse_local_temperature: 0.10
    coarse_gmls_enabled: false
    gmls_v2_correction_enabled: false
    fine_translation_enabled: true
    fine_translation_radius: 2
    fine_translation_temperature: 0.05
    anchor_power: 4.0
    moment_power: 2.0
    local_window_sigma: 0.10
    moment_border_margin: 2
    sigma_min: 0.005
    scale_min: 0.50
    scale_max: 3.00
    padding_mode: border
    align_corners: true
  bhlr:
    enabled: true # 1920 RGB high-resolution BHLR; its gamma_raw starts at 0
    scales: [3]
    high_to_semantic_ratio: 3
    detail_channels: 48
    stem_channels: 16
    guide_channels: 24
    guidance_mode: alignment
    detach_alignment_guidance: true

rgb_preserve:
  rgb_weights: runs/base/yolo26m-RGB_640_300e_bs16_seed0_new/weights/best.pt
  tir_weights: runs/base/yolo26m-TIR_640_300e_bs16_seed0_new/weights/best.pt

data:
  rgb: configs/datasets/UAV-CB-RGB.yaml
  tir: configs/datasets/UAV-CB-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative

train:
  device: "4,6"
  batch: 32
  batch_mode: global
  workers: 4
  val_batch: 4
  epochs: 50 # first validation experiment; increase only if it helps
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  patience: 30
  early_stop_min_delta: 0.000001
  ddp_find_unused_parameters: true
  resume: null
  stage2:
    enabled: true
    epochs: 100
    lr0: 0.001
    lrf: 0.01
    patience: 30
    rgb_head_lr_scale: 0.1
    early_stop_min_delta: 0.000001

augment:
  fliplr: 0.5
  flipud: 0.0
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
  alignment:
    enabled: true
    lambda_alignment: 0.20
    lambda_anchor: 1.00
    lambda_coarse: 1.00
    lambda_scale: 1.00
    lambda_targetness: 0.20
    smooth_l1_beta: 1.0
    targetness_alpha: 0.75
    targetness_gamma: 2.0
    gtga_gaussian_sigma_factor: 0.25
    gtga_gaussian_sigma_min_px: 1.0
    clamp_gt_translation: true
    lambda_v2_quality: 0.0
    lambda_v2_route: 0.0

output:
  project: runs/rgb_preserve_v1
  name: yolo26m_UAVCB_RGB1920sem640_TIR640_BHLR_DMLS_Fine_Scale_P3_Residual_2stage
