# V5 GLOBAL→NATIVE-HR LOCAL RGB-T -- original HVAD baseline untouched.
# Run export_global_local_rois.py --splits train val first.
# This is a new *separately trained* local network initialized from official YOLO26m.pt,
# NOT directly loading the global HVAD best.pt into the local network.
global:
  weights: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/runs/hvad_geohr_v1/yolo26m_UAVCB_P2_TriGateP3_HVAD_GeoHR_BS32_100e_seed0/weights/best.pt
local_model:
  name: yolo26m-p2
  fusion: add
  fusion_indices: [4, 6, 10]
  pretrained: true
  p2_head_pretrain: false
  verbose: true
roi:
  size: 640
  topk: 2
  candidate_conf: 0.001
  min_center_dist: 32.0
  min_visible: 0.60
  train_extra_jitter: 1
  jitter_high_px: 48
export:
  device: '5'
  workers: 2
data:
  rgb: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/UAV-CB-RGB.yaml
  tir: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/configs/datasets/UAV-CB-TIR.yaml
  rgb_imgsz: 1920
  rgb_semantic_imgsz: 640
  tir_imgsz: 640
  pair_mode: relative
  roi_root: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/data_generated/global_local_rois_top2
train:
  device: '5,6'
  batch: 8                 # GLOBAL batch; with 2 GPUs => 4 each
  accumulate: 2            # effective batch ~16 (but last group may be shorter)
  val_batch: 4
  workers: 4
  epochs: 100
  optimizer: SGD
  lr0: 0.005
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  seed: 0
  deterministic: true
  grad_clip: 10.0
  ddp_find_unused_parameters: true
augment:
  fliplr: 0.5
loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5
merge:
  local_nms_iou: 0.50
  min_local_conf: 0.50
  min_iou: 0.30
  min_area_ratio: 0.35
  max_area_ratio: 2.8
  max_center_distance: 1.8
  unmatched_add_conf: 0.90
eval:
  device: '5'
  workers: 2
  local_conf: 0.001
  iou: 0.70
  local_weights: /mnt/sda/taochangyong/Projects/Model/YOLO-tcy_v5/runs/global_local_roi/uavcb_local_rgbt_add_top2_100e/weights/best.pt
  save_dir: runs/global_local_roi/combined_eval_strict
output:
  project: runs/global_local_roi
  name: uavcb_local_rgbt_add_top2_100e
